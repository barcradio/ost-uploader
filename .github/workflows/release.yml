name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore ost-uploader.sln /p:Version=${{ steps.version.outputs.version }}

      - name: Build
        run: dotnet build ost-uploader.sln --configuration Release --no-restore /p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test ost-uploader.sln --configuration Release --no-build /p:Version=${{ steps.version.outputs.version }}

      - name: Publish
        run: >
          dotnet publish ost-uploader/ost-uploader.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:Version=${{ steps.version.outputs.version }}

      - name: Package release archive
        shell: pwsh
        run: |
          $zipPath = "ost-uploader-${{ steps.version.outputs.version }}-win-x64.zip"
          Compress-Archive -Path publish\* -DestinationPath $zipPath
          "zip_path=$zipPath" >> $env:GITHUB_OUTPUT
        id: package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.zip_path }}
          generate_release_notes: true
